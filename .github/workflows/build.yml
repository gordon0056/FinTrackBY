name: build

on:
  push:
    branches: [ main, master, public ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore FinTrackBY.sln
      - name: Build solution
        run: msbuild FinTrackBY.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal
